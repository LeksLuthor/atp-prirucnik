<h1 id="uvod-u-pandoc">Uvod u Pandoc</h1>
<p>Pandoc je univerzalni konverter dokumenata</p>
<h2 id="naredbe">Naredbe</h2>
<p>Provjera instalacije Pandoca u terminalu.</p>
<pre><code>pandoc --version</code></pre>
<p>Gdje se nalazi instalacija Pandoca na nasem racunalu, odaberite nize
navedenu naredbu.</p>
<pre><code>which pandoc</code></pre>
<p>Prica se nastavlja. Predaja zadatka funkcionira preko <a
href="https://merlin.srce.hr">Merlina</a>.</p>
